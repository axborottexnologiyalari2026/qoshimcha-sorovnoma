<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitleText">Qo'shimcha So'rovnoma - SO'ROVNOMA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .bg-custom-image {
            background-image: linear-gradient(rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.92)), url('https://admission.tuit.uz/assets/img/update1/normal/video_2.jpg');
        }
        .html-light .bg-custom-image {
            background-image: linear-gradient(rgba(241, 245, 249, 0.94), rgba(241, 245, 249, 0.94)), url('https://admission.tuit.uz/assets/img/update1/normal/video_2.jpg');
        }

        /* Dark mode: input focus/autofill oq bo'lib ketmasligi */
        .dark input,
        .dark select,
        .dark textarea {
            color-scheme: dark;
            background-color: rgb(30 41 59 / 0.85) !important;
            color: #f1f5f9 !important;
            border-color: #334155 !important;
        }
        .dark input:focus,
        .dark select:focus,
        .dark textarea:focus {
            background-color: rgb(30 41 59 / 0.95) !important;
            color: #f8fafc !important;
            outline: none;
        }
        .dark input::placeholder {
            color: #64748b !important;
        }
        /* Chrome autofill oq fonni olib tashlash */
        .dark input:-webkit-autofill,
        .dark input:-webkit-autofill:hover,
        .dark input:-webkit-autofill:focus,
        .dark input:-webkit-autofill:active {
            -webkit-text-fill-color: #f1f5f9 !important;
            -webkit-box-shadow: 0 0 0px 1000px rgb(30 41 59) inset !important;
            transition: background-color 9999s ease-in-out 0s;
            caret-color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between relative bg-cover bg-center bg-no-repeat bg-custom-image transition-colors duration-300">

    <header class="bg-slate-900/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 transition-colors duration-300">
        <div class="w-full px-[16px] sm:px-[50px] h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-1 rounded-xl shadow-sm w-10 h-10 flex items-center justify-center overflow-hidden border border-slate-700">
                    <img src="https://www.eduopinions.com/wp-content/uploads/2022/04/Tashkent-University-of-Information-Technologies.png" alt="TATU Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 id="headerTitle" class="font-bold text-base sm:text-lg text-white leading-tight">Qo'shimcha So'rovnoma</h1>
                    <p class="text-xs text-slate-400">TATU Sport Festivali</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 w-10 h-10 rounded-xl flex items-center justify-center transition border border-slate-700 cursor-pointer shadow-sm" title="Rejimni o'zgartirish">
                    <svg id="themeIcon" class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="w-full px-[16px] sm:px-[50px] py-8 flex-grow flex items-center justify-center">
        <div class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 max-w-lg w-full p-6 sm:p-8 transition-colors duration-300">
            <div class="text-center mb-6">
                <h2 id="formTitle" class="text-xl font-bold text-slate-900 dark:text-white">Maxsus So'rovnoma</h2>
                <p id="formSubtitle" class="text-sm text-slate-600 dark:text-slate-400 mt-1">Iltimos, quyidagi qo'shimcha savollarga javob bering</p>
            </div>

            <form id="extraSurveyForm" onsubmit="submitExtraSurvey(event)" class="space-y-4">
                <div id="dynamicExtraFields" class="space-y-4">
                    <p class="text-xs text-slate-400 text-center py-2">Savollar yuklanmoqda...</p>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl text-sm transition cursor-pointer shadow-lg shadow-blue-600/25">Ma'lumotlarni yuborish</button>
            </form>
        </div>
    </main>

    <!-- Footer butunlay olib tashlandi -->
    <div class="h-4"></div>

    <script>
        const SUPABASE_URL = 'https://lqlezckvsfcyxzecngor.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Q964RE6i9jVArXpyeWXxYA_kuhcLAvw';
        let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        const sunSvg = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />`;
        const moonSvg = `<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />`;

        function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            const icon = document.getElementById('themeIcon');
            if (saved === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('html-light');
                icon.innerHTML = moonSvg;
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('html-light');
                icon.innerHTML = sunSvg;
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                document.documentElement.classList.remove('html-light');
                localStorage.setItem('theme', 'dark');
                icon.innerHTML = sunSvg;
            } else {
                document.documentElement.classList.add('html-light');
                localStorage.setItem('theme', 'light');
                icon.innerHTML = moonSvg;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            if (!supabaseClient) return;

            const { data: settings } = await supabaseClient.from('extra_survey_settings').select('*').eq('id', 1).single();
            if (settings) {
                document.getElementById('pageTitleText').textContent = settings.title || 'Qo\'shimcha So\'rovnoma';
                document.getElementById('headerTitle').textContent = settings.title || 'Qo\'shimcha So\'rovnoma';
                document.getElementById('formTitle').textContent = settings.title || 'Maxsus So\'rovnoma';
                document.getElementById('formSubtitle').textContent = settings.subtitle || '';
            }

            const container = document.getElementById('dynamicExtraFields');
            const { data: fields, error } = await supabaseClient.from('extra_dynamic_inputs').select('*').order('sort_order', { ascending: true });
            
            if (error || !fields || fields.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center">Hozircha qo'shimcha so'rovnomalar mavjud emas.</p>`;
                return;
            }

            container.innerHTML = '';
            fields.forEach(field => {
                const isPhone = /telefon|raqam|phone/i.test(field.label);
                let html = `<div><label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">${field.label}</label>`;
                
                if (field.type === 'select' && field.options) {
                    html += `<select name="extra_field" data-label="${field.label}" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800/85 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500">`;
                    field.options.forEach(opt => html += `<option value="${opt}">${opt}</option>`);
                    html += `</select>`;
                } else if (field.type === 'multi' && field.options) {
                    // Bir nechta variantli — checkboxlar
                    // Uzun matn → to'liq qator, kalta matn → 2 ustun
                    html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-1" data-multi-label="${field.label}">`;
                    field.options.forEach(opt => {
                        const isLong = String(opt).trim().length > 28;
                        const spanClass = isLong ? 'sm:col-span-2' : '';
                        html += `<label class="flex items-center space-x-2.5 p-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-300 dark:border-slate-700 rounded-xl cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors ${spanClass}">
                            <input type="checkbox" name="extra_multi_${field.label}" value="${opt}" class="w-4 h-4 shrink-0 text-blue-600 bg-white dark:bg-slate-700 border-slate-300 dark:border-slate-600 rounded focus:ring-blue-500">
                            <span class="text-sm font-medium text-slate-800 dark:text-slate-200 leading-snug">${opt}</span>
                        </label>`;
                    });
                    html += `</div>`;
                } else if (isPhone) {
                    html += `<input type="tel" name="extra_field" data-label="${field.label}" data-phone="true" required
                        value="+998 "
                        placeholder="+998 XX XXX XX XX"
                        maxlength="17"
                        class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800/85 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500">`;
                } else {
                    html += `<input type="${field.type === 'number' ? 'number' : 'text'}" name="extra_field" data-label="${field.label}" required placeholder="${field.placeholder || field.label + 'ni kiriting'}" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-800/85 border border-slate-300 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500">`;
                }
                html += `</div>`;
                container.innerHTML += html;
            });

            initPhoneMasks();
        });

        function formatPhoneValue(digits) {
            // 9 ta raqam: XX XXX XX XX (operator kodi + abonent raqami)
            const d = digits.slice(0, 9);
            let out = '';
            if (d.length > 0) out += d.slice(0, 2);
            if (d.length > 2) out += ' ' + d.slice(2, 5);
            if (d.length > 5) out += ' ' + d.slice(5, 7);
            if (d.length > 7) out += ' ' + d.slice(7, 9);
            return out;
        }

        function initPhoneMasks() {
            document.querySelectorAll('input[data-phone="true"]').forEach(input => {
                // Fokusda +998 ni saqlab qolish
                input.addEventListener('focus', () => {
                    if (!input.value.startsWith('+998')) {
                        input.value = '+998 ';
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // +998 qismini o'chirishga yo'l qo'ymaslik
                    const cursor = input.selectionStart;
                    if ((e.key === 'Backspace' || e.key === 'Delete') && cursor <= 5) {
                        e.preventDefault();
                    }
                });

                input.addEventListener('input', () => {
                    // Faqat raqamlarni olish (+998 dan keyin)
                    let raw = input.value.replace(/\D/g, '');
                    // 998 prefiksini olib tashlash
                    if (raw.startsWith('998')) raw = raw.slice(3);
                    raw = raw.slice(0, 9);
                    input.value = '+998 ' + formatPhoneValue(raw);
                    // Kursorni oxiriga
                    const len = input.value.length;
                    input.setSelectionRange(len, len);
                });

                // Paste himoyasi
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                    let raw = pasted.startsWith('998') ? pasted.slice(3) : pasted;
                    raw = raw.slice(0, 9);
                    input.value = '+998 ' + formatPhoneValue(raw);
                });
            });
        }

        async function submitExtraSurvey(e) {
            e.preventDefault();
            if (!supabaseClient) return;

            let extraData = {};

            // Oddiy maydonlar (text, number, select, phone)
            document.querySelectorAll('[name="extra_field"]').forEach(input => {
                extraData[input.getAttribute('data-label')] = input.value.trim();
            });

            // Bir nechta variantli (checkbox)
            document.querySelectorAll('[data-multi-label]').forEach(group => {
                const label = group.getAttribute('data-multi-label');
                const checked = Array.from(group.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
                extraData[label] = checked.length ? checked.join(', ') : '';
            });

            // F.I.Sh va Lavozimni dinamik maydonlardan olish (foydalanuvchi o'zi qo'shadi)
            const findByLabel = (patterns) => {
                for (const key of Object.keys(extraData)) {
                    if (patterns.some(p => key.toLowerCase().includes(p))) return extraData[key];
                }
                return '';
            };
            const fullName = findByLabel(['f.i.sh', 'fish', 'fio', 'ism', 'familiya', 'name']) || Object.values(extraData)[0] || "Noma'lum";
            const role = findByLabel(['lavozim', 'role', 'maqom', 'status']) || '-';

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Yuborilmoqda...';
            btn.disabled = true;

            try {
                const { error } = await supabaseClient.from('participants').insert([{
                    full_name: fullName,
                    role: role,
                    extra_data: extraData,
                    sports: []
                }]);

                if (error) alert('Xatolik: ' + error.message);
                else {
                    alert('Maʼlumotlaringiz muvaffaqiyatli saqlandi!');
                    document.getElementById('extraSurveyForm').reset();
                }
            } catch (err) {
                alert('Tarmoqda xatolik.');
            } finally {
                btn.textContent = "Ma'lumotlarni yuborish";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
